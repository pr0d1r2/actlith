# generated by actlith gen from .actlith; do not edit
---
# Poll upstream for a new release and propose the bump as a PR. Pull model:
# no cross-repo token, nothing upstream needs to know this repo exists.
# The bump script prints `NEW_VERSION=<version>`; nothing printed, no PR.
#
# Known limit (R5): a PR opened with GITHUB_TOKEN does not trigger other
# workflows, so the gate does not run on it until someone pushes or reruns
# it. args `token=<SECRET>` names a GitHub App or fine-grained token
# secret that lifts this.
#
# Runs are never cancelled (V26): a cancelled run can leave a half-pushed
# branch. A branch already on origin means its PR is open, so a run
# exits 0 and opens no second one.
name: up-custom

on:
  schedule:
    - cron: '15 */6 * * *'
  workflow_dispatch:

concurrency:
  group: up-custom-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  bump:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
      pull-requests: write
    timeout-minutes: 30
    steps:
      # Credentials kept: this job pushes the bump branch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: true
          token: ${{ secrets.BUMP_TOKEN }}
      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342  # v31.11.0
        with:
          extra_nix_config: |
            extra-substituters = https://pr0d1r2.cachix.org
            extra-trusted-public-keys = pr0d1r2.cachix.org-1:NfWjbhgAj41byXhCKiaE+av3Vnphm1fTezHXEGsiQIM=
      # Read-only here. The push happens on the PR's own CI run, once a human
      # has looked at it.
      - uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71  # v17
        with:
          name: pr0d1r2
          skipPush: true
      - id: bump
        run: 'set -o pipefail; "./$SCRIPT" | tee -a "$GITHUB_OUTPUT"'
        env:
          GH_TOKEN: ${{ secrets.BUMP_TOKEN }}
          SCRIPT: scripts/bump.sh
      - if: ${{ steps.bump.outputs.NEW_VERSION != '' }}
        run: 'bash scripts/actlith/open-pr.sh "$BRANCH" "$TITLE" "$BODY"'
        env:
          BODY: 'Bumped by scripts/bump.sh, which ran before this PR.'
          BRANCH: bump/hk-${{ steps.bump.outputs.NEW_VERSION }}
          GH_TOKEN: ${{ secrets.BUMP_TOKEN }}
          TITLE: 'build: bump to ${{ steps.bump.outputs.NEW_VERSION }}'
