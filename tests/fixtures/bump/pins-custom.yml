# generated by actlith gen from .actlith; do not edit
---
# Follow nixpkgs-lock and propose the bump as a PR. Pull model: this repo
# polls; nixpkgs-lock holds no cross-repo token. `actlith pin` and
# `actlith gen` run in the same branch, so action pins and a new actlith
# arrive through the same reviewed PR.
#
# Known limit (R5): a PR opened with GITHUB_TOKEN does not trigger other
# workflows, so the gate does not run on it until someone pushes or reruns
# it. args `token=<SECRET>` names a GitHub App or fine-grained token
# secret that lifts this.
#
# Runs are never cancelled (V26): a cancelled run can leave a half-pushed
# branch. A branch already on origin means its PR is open, so a run
# exits 0 and opens no second one.
name: pins-custom

on:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

concurrency:
  group: pins-custom-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    timeout-minutes: 45
    steps:
      # Credentials kept: this job pushes the bump branch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: true
          token: ${{ secrets.PINS_TOKEN }}
      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342  # v31.11.0
        with:
          extra_nix_config: |
            extra-substituters = https://pr0d1r2.cachix.org
            extra-trusted-public-keys = pr0d1r2.cachix.org-1:NfWjbhgAj41byXhCKiaE+av3Vnphm1fTezHXEGsiQIM=
      - run: 'nix develop --command bash scripts/actlith/update-pins.sh "$BUILD"'
        env:
          BUILD: '.#hk'
          GH_TOKEN: ${{ secrets.PINS_TOKEN }}
