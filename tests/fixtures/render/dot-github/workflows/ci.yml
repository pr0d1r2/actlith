      - if: >-
          ${{ github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository }}
        run: >-
          set -o pipefail; nix build --no-link --print-out-paths ".#devShells.$(nix eval --raw --impure --expr
          builtins.currentSystem).default.inputDerivation" | cachix push pr0d1r2
        timeout-minutes: 10
        continue-on-error: true
