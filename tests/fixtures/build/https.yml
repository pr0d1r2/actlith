      - run: 'nix build --print-build-logs ".#packages.$SYSTEM.hk"'
        env:
          SYSTEM: ${{ matrix.system }}
      # Push only from main: what main builds is what the cache must hold.
      - if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
