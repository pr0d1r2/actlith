            extra-trusted-public-keys = example-cache-1:79mE5RnWzUnV7Xlzq0cdEHe4GW4t0qBGsmoGOUr64p0=
      - run: nix flake check --all-systems --print-build-logs
  # This asks the https cache itself for every built path, after the
