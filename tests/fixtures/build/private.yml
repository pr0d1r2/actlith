          ${{ github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository }}
        run: bash scripts/actlith/read-netrc.sh
        env:
          CACHE: private-cache
          NETRC: ${{ secrets.PRIVATE_READ }}
          NETRC_SECRET: PRIVATE_READ
