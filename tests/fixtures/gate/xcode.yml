# generated by actlith gen from .actlith; do not edit
---
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    name: gate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # aarch64-darwin
        os: [macos-latest]
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.app/Contents/Developer
    steps:
      # xcode=26.4: this Xcode, never the image's default. An image without
      # it fails here, and the log names the Xcode the gate ran with.
      - run: 'test -d "$DEVELOPER_DIR" || { echo "::error::missing $DEVELOPER_DIR"; exit 1; }; xcodebuild -version'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          # Full history: tdd-order reads the push range, and a later semver
          # step compares with the last release tag.
          fetch-depth: 0
      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342  # v31.11.0
      - run: nix develop --command hk check --all --check
