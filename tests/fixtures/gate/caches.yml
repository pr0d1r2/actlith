# generated by actlith gen from .actlith; do not edit
---
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    name: gate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # x86_64-linux, aarch64-linux, aarch64-darwin, x86_64-darwin
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          # Full history: tdd-order reads the push range, and a later semver
          # step compares with the last release tag.
          fetch-depth: 0
      # The cache's url or key is a secret, which a fork PR does not get: this
      # run trusts the cache, a fork PR's runs without it.
      - if: >-
          ${{ github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository }}
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342  # v31.11.0
        with:
          extra_nix_config: |
            extra-substituters = ${{ secrets.HIDDEN_URL }}
            extra-trusted-public-keys = ${{ secrets.HIDDEN_KEY }}
      # A fork PR: no cache secret, so no cache rather than an empty one.
      - if: >-
          ${{ github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name != github.repository }}
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342  # v31.11.0
      # Push what this job builds to the https cache, with the netrc its push
      # secret holds. Fork PRs get no secret, so they skip the push.
      - if: >-
          ${{ github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository }}
        run: bash scripts/actlith/push-https.sh devShells.default.inputDerivation
        env:
          NETRC: ${{ secrets.HIDDEN_NETRC }}
          URL: ${{ secrets.HIDDEN_URL }}
      - run: nix develop --command hk check --all --check
